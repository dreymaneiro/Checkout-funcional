<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout de Compra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f4f4f8;
            font-family: Arial, Helvetica, sans-serif;
        }

        .checkout {
            width: 450px;
            padding: 32px 30px;

            background: white;
            border-radius: 12px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin: 18px 0 26px;

            text-align: center;
            font-size: 29px;
            color: #111;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            font-size: 17px;
            font-weight: bold;
            color: #555;
        }

        /* Campos para digitar Produto e Frete */
        input {
            width: 100%;
            height: 48px;

            padding: 0 13px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 17px;
            outline: none;
        }

        input:focus {
            border-color: #087ff5;
            box-shadow: 0 0 3px rgba(8, 127, 245, 0.3);
        }

        .titulo-pagamento {
            margin: 17px 0;

            text-align: center;

            font-size: 18px;
            font-weight: bold;
            color: #555;
        }

        .pagamentos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            height: 50px;

            border: none;
            border-radius: 7px;

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }

        .pix {
            background: #14b3a5;
        }

        .dinheiro {
            background: #28a745;
        }

        .cartao {
            background: #087ff5;
        }

        .parcelado {
            background: #6c757d;
        }

        .resultado {
            margin-top: 24px;
            padding: 22px 18px;

            background: #f5f6f7;

            border-left: 5px solid #087ff5;
            border-radius: 6px;
        }

        .forma {
            margin-bottom: 5px;

            font-size: 17px;
            color: #333;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            color: #222;
        }

        @media (max-width: 500px) {

            .checkout {
                width: 92%;
                padding: 25px 20px;
            }

            .pagamentos {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <main class="checkout">

        <h1>Checkout de Compra</h1>

        <!-- VALOR DO PRODUTO -->
        <div class="campo">

            <label for="produto">
                Preço do Produto (R$):
            </label>

            <input
                type="number"
                id="produto"
                placeholder="Digite o valor do produto"
                min="0"
                step="0.01"
            >

        </div>


        <!-- VALOR DO FRETE -->
        <div class="campo">

            <label for="frete">
                Valor do Frete (R$):
            </label>

            <input
                type="number"
                id="frete"
                placeholder="Digite o valor do frete"
                min="0"
                step="0.01"
            >

        </div>


        <div class="titulo-pagamento">
            Forma de Pagamento:
        </div>


        <div class="pagamentos">

            <button
                class="pix"
                onclick="calcular('PIX')"
            >
                PIX (-10%)
            </button>

            <button
                class="dinheiro"
                onclick="calcular('Dinheiro')"
            >
                Dinheiro (-5%)
            </button>

            <button
                class="cartao"
                onclick="calcular('Cartão à vista')"
            >
                Cartão à vista
            </button>

            <button
                class="parcelado"
                onclick="calcular('Parcelado')"
            >
                Parcelado (+5%)
            </button>

        </div>


        <!-- RESULTADO -->
        <div class="resultado">

            <div
                class="forma"
                id="forma"
            >
                Forma: -
            </div>

            <div
                class="total"
                id="total"
            >
                Total: R$ 0,00
            </div>

        </div>

    </main>


    <script>

        function calcular(pagamento) {

            // Pega o valor digitado no produto
            const produto = parseFloat(
                document.getElementById("produto").value
            ) || 0;


            // Pega o valor digitado no frete
            const frete = parseFloat(
                document.getElementById("frete").value
            ) || 0;


            // Soma produto + frete
            let total = produto + frete;


            // Aplica a forma de pagamento
            if (pagamento === "PIX") {

                // 10% de desconto
                total = total * 0.90;

            } else if (pagamento === "Dinheiro") {

                // 5% de desconto
                total = total * 0.95;

            } else if (pagamento === "Cartão à vista") {

                // Sem desconto ou acréscimo
                total = total;

            } else if (pagamento === "Parcelado") {

                // 5% de acréscimo
                total = total * 1.05;
            }


            // Mostra a forma de pagamento
            document.getElementById("forma").textContent =
                "Forma: " + pagamento;


            // Mostra o total formatado em reais
            document.getElementById("total").textContent =
                "Total: R$ " +
                total.toLocaleString("pt-BR", {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
        }

    </script>

</body>
</html>
